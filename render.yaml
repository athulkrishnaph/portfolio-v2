# Render Blueprint: one-click deploy of the whole site (Go API + built
# Angular app, one Docker image) on Render's free plan.
# https://render.com/docs/blueprint-spec
#
# Usage: push this repo to GitHub, then on Render click New → Blueprint and
# point it at the repo. Render reads this file and creates the service below;
# you only fill in the secret values it asks for (see README → Deployment).
#
# The database is NOT created here: use a free Neon Postgres project instead
# (Render's own free Postgres expires after 30 days). See the README for
# Neon + pgvector setup.
services:
  - type: web
    name: portfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Paste your Neon connection string here (Render → dashboard → env vars).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://portfolio.onrender.com, fill in after first deploy
      - key: CORS_ALLOWED_ORIGINS
        sync: false # same URL as PUBLIC_BASE_URL
      - key: TRUST_PROXY
        value: "true" # Render sits behind its own proxy
      # AI assistant (optional): leave GEMINI_API_KEY unset to disable it.
      - key: GEMINI_API_KEY
        sync: false
      # Uploads in Supabase Storage (optional, recommended: Render's free
      # disk is wiped on every restart). Needs a public bucket.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_BUCKET
        value: uploads
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # "Sign in with Google" on the admin login (optional).
      - key: GOOGLE_CLIENT_ID
        sync: false
