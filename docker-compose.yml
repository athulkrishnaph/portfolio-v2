# Local development: only PostgreSQL (the default).
#   docker compose up -d
#
# Whole application (PostgreSQL + API serving the built site on :8080):
#   docker compose --profile app up -d --build
#
# The database credentials below match the DATABASE_URL example in .env.example.
# Values like ${JWT_SECRET} are read from the .env file next to this file.
services:
  postgres:
    # PostgreSQL 17 with the pgvector extension (needed by the AI assistant).
    # Switching an existing volume from postgres:17-alpine: see README →
    # "Docker and pgvector" (run REINDEX once because of the OS change).
    image: pgvector/pgvector:pg17
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    container_name: portfolio-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside Docker the database host is the service name, not localhost.
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/portfolio?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}  # required; the API refuses to start without a 32+ char secret
      JWT_TTL: ${JWT_TTL:-2h}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # AI assistant (optional; disabled when GEMINI_API_KEY is empty).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.6}
      CHAT_DAILY_LIMIT: ${CHAT_DAILY_LIMIT:-300}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  postgres-data:
  uploads:
