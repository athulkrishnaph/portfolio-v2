<label class="field__label" [attr.for]="inputId">
  <!-- The non-breaking space keeps the * on the same line as the last word. -->
  {{ label() }}@if (isRequired()) {<span class="field__required" aria-hidden="true">&nbsp;*</span>}
</label>
<ng-content />
@if (errorMessage(); as message) {
  <p class="field__error" [id]="messageId">{{ message }}</p>
} @else if (hint()) {
  <p class="field__hint" [id]="messageId">{{ hint() }}</p>
}
