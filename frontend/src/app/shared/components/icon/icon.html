<svg
  viewBox="0 0 24 24"
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.fill]="filled() ? 'currentColor' : 'none'"
  [attr.stroke]="filled() ? 'none' : 'currentColor'"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.aria-hidden]="label() ? null : 'true'"
  [attr.aria-label]="label() || null"
  [attr.role]="label() ? 'img' : null"
  focusable="false"
>
  <path [attr.d]="path()" />
</svg>
