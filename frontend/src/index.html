<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal developer portfolio">
  <!-- The "</>" logo. Browsers that support SVG icons use favicon.svg; others use the .ico. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Apply the saved colour theme before the app loads, so there is no
       flash of the default theme. Kept in sync with core/ui/theme.service.ts. -->
  <script>
    try {
      var theme = localStorage.getItem('portfolio.theme');
      if (theme && theme !== 'system') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
